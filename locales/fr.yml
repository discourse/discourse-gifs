      limit_infinite_search_results: "Limiter le nombre de GIF renvoyés lors du défilement continu pour éviter de dépasser les limites de requêtes de l'API."
      max_results_limit: 'Tenor et GIPHY : lorsque « Limiter les résultats de recherche en défilement continu » est activé, la recherche s''arrête une fois ce nombre maximal de GIF atteint. Chaque appel API renvoie 24 résultats, <i>p. ex. pour une limite de 240 résultats : 240/24 = 10 appels API</i>.'
      tenor_api_key: >
        Tenor : clé API V2. Les instructions pour en obtenir une figurent dans <a target="_blank" rel="noreferrer noopener" href='https://meta.discourse.org/t/discourse-gifs-component/158738'>Discourse Meta - Discourse Gifs</a>. <br/><br/> <b>Attention : utilisateurs de l'ancienne API Tenor V1, générez une nouvelle clé API V2</b>
