    settings:
      api_provider: "Quel fournisseur de GIF souhaitez-vous utiliser ?"
      giphy_api_key: "GIPHY : clé API"
      giphy_file_format: "GIPHY : format d'image à utiliser. Le format WebP produit des fichiers plus petits, qui se chargent plus rapidement, tandis que le GIF est compatible avec les anciens navigateurs."
      giphy_size_variant: >
        GIPHY : taille des images à utiliser. Faites votre choix en fonction de la limite de téléversement de votre site. <ul> <li>downsized = moins de 2 Mo</li> <li>downsized_medium = moins de 5 Mo (recommandé pour la plupart des sites)</li> <li>downsized_large = moins de 8 Mo</li> <li>original = taille d'origine, sans limite</li> <ul>
