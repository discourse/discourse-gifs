        Tenor : format d'image à utiliser <ul> <li>gif = taille d'origine, qualité maximale (fichiers les plus volumineux)</li> <li>mediumgif = taille d'origine avec compression (recommandé pour la plupart des sites)</li> <li>tinygif = largeur réduite à 220 px (fichiers plus petits)</li> <li>nanogif = hauteur réduite à 90 px (fichiers les plus petits)</li> <ul>
      tenor_content_filter: >
        Tenor : niveau de filtrage du contenu des résultats. Pour en savoir plus, consultez <a target="_blank" rel="noreferrer noopener" href="https://developers.google.com/tenor/guides/content-filtering">les guides de l'API Tenor</a>.
      tenor_country: >
        Tenor : code pays à deux lettres de la requête. Vous trouverez le code de votre pays dans <a target="_blank" rel="noreferrer noopener" href="https://en.wikipedia.org/wiki/ISO_3166-1#Current_codes">Wikipédia - ISO_3166-1</a>.
      tenor_locale: >
        Tenor : langue à utiliser pour la recherche. Un code pays facultatif permet de distinguer les variantes régionales.<br/><br/> Le format doit être « xx_YY », où « xx » est le <a target="_blank" rel="noreferrer noopener" href="https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes">code de langue</a> <b>obligatoire</b> et « _YY » le <a target="_blank" rel="noreferrer noopener" href="https://en.wikipedia.org/wiki/ISO_3166-1#Current_codes">code pays</a> <b>facultatif</b>. Consultez les <a target="_blank" rel="noreferrer noopener" href="https://developers.google.com/tenor/guides/localization">guides de localisation de l'API Tenor</a>.
      klipy_api_key: "Klipy : clé API. Vous pouvez l'obtenir depuis votre compte Klipy."
