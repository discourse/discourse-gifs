      klipy_content_filter: "Klipy : niveau de filtrage du contenu des résultats."
      klipy_country: >
        Klipy : code pays à deux lettres de la requête. Vous trouverez le code de votre pays dans <a target="_blank" rel="noreferrer noopener" href="https://en.wikipedia.org/wiki/ISO_3166-1#Current_codes">Wikipédia - ISO_3166-1</a>.
      klipy_locale: >
        Klipy : langue à utiliser pour la recherche. Un code pays facultatif permet de distinguer les variantes régionales.<br/><br/> Le format doit être « xx_YY », où « xx » est le <a target="_blank" rel="noreferrer noopener" href="https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes">code de langue</a> <b>obligatoire</b> et « _YY » le <a target="_blank" rel="noreferrer noopener" href="https://en.wikipedia.org/wiki/ISO_3166-1#Current_codes">code pays</a> <b>facultatif</b>.
